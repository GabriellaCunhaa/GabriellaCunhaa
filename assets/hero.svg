<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Gabriella Swarttz — Full Stack e Engenharia de Agentes de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07040D"/><stop offset=".55" stop-color="#170B2B"/><stop offset="1" stop-color="#2D0A4E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8A2BE2" stop-opacity=".55"/><stop offset="1" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F3D77A"/><stop offset=".45" stop-color="#D4AF37"/><stop offset="1" stop-color="#5A3A00"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#F3D77A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#B57BFF"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .s{fill:#fff;animation:tw 3s ease-in-out infinite}
      .s:nth-child(3n){animation-duration:4.2s;animation-delay:.8s}
      .s:nth-child(4n){animation-duration:2.4s;animation-delay:1.6s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .in{opacity:0;animation:in 1s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .float{animation:fl 6s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g>
      <circle class="s" cx="60" cy="40" r="1.4"/><circle class="s" cx="140" cy="300" r="1"/><circle class="s" cx="220" cy="90" r="1.6"/>
      <circle class="s" cx="310" cy="340" r="1.2"/><circle class="s" cx="380" cy="30" r="1"/><circle class="s" cx="470" cy="210" r="1.3"/>
      <circle class="s" cx="530" cy="350" r="1"/><circle class="s" cx="590" cy="60" r="1.5"/><circle class="s" cx="660" cy="320" r="1.1"/>
      <circle class="s" cx="700" cy="25" r="1"/><circle class="s" cx="1150" cy="60" r="1.4"/><circle class="s" cx="1170" cy="330" r="1"/>
      <circle class="s" cx="1080" cy="355" r="1.3"/><circle class="s" cx="40" cy="190" r="1"/><circle class="s" cx="250" cy="250" r="1.1"/>
      <circle class="s" cx="1110" cy="190" r="1"/><circle class="s" cx="760" cy="355" r="1.4"/><circle class="s" cx="430" cy="120" r="1"/>
      <circle class="s" cx="100" cy="120" r="1.2"/><circle class="s" cx="640" cy="160" r="1"/>
    </g>
    <!-- planeta "Mundo Swarttz" -->
    <g transform="translate(920 190)">
      <circle r="190" fill="url(#glow)"/>
      <g class="float">
        <ellipse rx="150" ry="40" fill="none" stroke="#B57BFF" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-18)"/>
        <circle r="78" fill="url(#planet)"/>
        <path d="M-60,-20 Q0,-38 70,-12" stroke="#7A5200" stroke-opacity=".35" stroke-width="7" fill="none"/>
        <path d="M-74,18 Q0,2 74,22" stroke="#7A5200" stroke-opacity=".25" stroke-width="5" fill="none"/>
        <path d="M-150,0 A150,40 0 0 0 150,0" transform="rotate(-18)" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
        <g transform="rotate(-18)">
          <circle r="7" fill="#F3D77A">
            <animateMotion dur="9s" repeatCount="indefinite" path="M150,0 A150,40 0 1 1 -150,0 A150,40 0 1 1 150,0"/>
          </circle>
          <circle r="4.5" fill="#B57BFF">
            <animateMotion dur="14s" begin="-5s" repeatCount="indefinite" path="M150,0 A150,40 0 1 1 -150,0 A150,40 0 1 1 150,0"/>
          </circle>
        </g>
      </g>
    </g>
    <g class="t">
      <text class="in d1" x="70" y="118" fill="#B57BFF" font-size="18" letter-spacing="6">OLÁ, MUNDO! EU SOU A</text>
      <text class="in d2" x="66" y="196" fill="url(#gold)" font-size="72" font-weight="800">Gabriella Swarttz</text>
      <text class="in d3" x="70" y="248" fill="#E6E6E6" font-size="24">Full Stack <tspan fill="#D4AF37">✦</tspan> Engenharia de Agentes de IA</text>
      <g class="in d3">
        <rect x="70" y="282" width="168" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#8A2BE2"/>
        <text x="154" y="304" fill="#E6E6E6" font-size="14" text-anchor="middle">📍 Goiás, Brasil</text>
        <rect x="250" y="282" width="232" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#D4AF37"/>
        <circle cx="272" cy="299" r="5" fill="#3DDC84"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="370" y="304" fill="#E6E6E6" font-size="14" text-anchor="middle">aberta a oportunidades</text>
      </g>
    </g>
  </g>
</svg>
