    <text x="28" y="222" class="l" style="animation-delay:2.6s"><tspan class="g">rumo  </tspan><tspan class="c"> agentes de IA e sistemas inteligentes</tspan></text>
    <text x="28" y="260" class="l" style="animation-delay:3.3s"><tspan class="p">❯</tspan><tspan class="c"> echo $FILOSOFIA</tspan></text>
