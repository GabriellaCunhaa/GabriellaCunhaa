<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="Terminal: quem é a Gabriella">
  <defs><style>
    .m{font-family:'Fira Code',Consolas,'Courier New',monospace;font-size:16px}
    .l{opacity:0;animation:show .01s forwards}
    @keyframes show{to{opacity:1}}
    .p{fill:#B57BFF}.c{fill:#E6E6E6}.g{fill:#D4AF37}.k{fill:#8C8C9A}.ok{fill:#3DDC84}
    .cur{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style></defs>
  <rect width="860" height="430" rx="16" fill="#0D0B14" stroke="#4B0082" stroke-width="2"/>
  <path d="M0 16 A16 16 0 0 1 16 0 H844 A16 16 0 0 1 860 16 V44 H0Z" fill="#1A1228"/>
  <circle cx="26" cy="22" r="7" fill="#FF5F57"/><circle cx="50" cy="22" r="7" fill="#FEBC2E"/><circle cx="74" cy="22" r="7" fill="#28C840"/>
