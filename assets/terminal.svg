  <g class="m">
    <text x="28" y="84"  class="l" style="animation-delay:.3s"><tspan class="p">❯</tspan><tspan class="c"> whoami</tspan></text>
    <text x="28" y="110" class="l" style="animation-delay:.9s"><tspan class="g">Gabriella Swarttz</tspan><tspan class="k"> — dev full stack em formação, de Goiás 🇧🇷</tspan></text>
    <text x="28" y="148" class="l" style="animation-delay:1.6s"><tspan class="p">❯</tspan><tspan class="c"> cat foco.txt</tspan></text>
    <text x="28" y="174" class="l" style="animation-delay:2.2s"><tspan class="g">front </tspan><tspan class="c"> React · Next.js · TypeScript · Tailwind</tspan></text>
